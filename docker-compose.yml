name: ordoplan
x-app: &app
  build: .
  image: ordoplan:1.0.0
  restart: unless-stopped
  volumes:
    - runtime:/app/.runtime
  environment: &env
    ORDOPLAN_RUNTIME: /app/.runtime
    ORDOPLAN_DEMO: '1'
    ORDOPLAN_MODEL_MODE: ocr
    ORDOPLAN_RETRIEVAL: local
    ORDOPLAN_RERANKER: local
    MCP_URL: http://mcp:8101/mcp
    API_URL: http://api:8000
    QDRANT_URL: http://qdrant:6333
    LANGCHAIN_TRACING_V2: 'false'
    ANONYMIZED_TELEMETRY: 'false'
    TELEGRAM_BRIDGE_SECRET: ${TELEGRAM_BRIDGE_SECRET:-}
  cpus: 2
  mem_limit: 2g
services:
  qdrant:
    image: qdrant/qdrant:v1.16.0
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
    volumes:
      - qdrant:/qdrant/storage
    restart: unless-stopped
  mcp:
    <<: *app
    command: python -m uvicorn src.mcp_server.server:app --host 0.0.0.0 --port 8101 --no-access-log
  api:
    <<: *app
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      mcp:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
  ui:
    <<: *app
    command: streamlit run src/ui/app.py --server.address 0.0.0.0 --server.port 8501 --browser.gatherUsageStats false
    ports:
      - '127.0.0.1:8501:8501'
    depends_on:
      api:
        condition: service_healthy
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0
    profiles: [tracking]
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000 --allowed-hosts 'localhost:*,127.0.0.1:*,mlflow:*'
    volumes:
      - mlflow:/mlflow
    ports:
      - '127.0.0.1:5000:5000'
  telegram:
    <<: *app
    profiles: [telegram]
    command: python -m src.bot.telegram_bot
    environment:
      <<: *env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BRIDGE_SECRET: ${TELEGRAM_BRIDGE_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
volumes:
  runtime:
  qdrant:
  mlflow:
