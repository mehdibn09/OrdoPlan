[project]
name = "ordoplan"
version = "1.0.0"
description = "Assistant d'ordonnancement multimodal et agentique local"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Field 'lifespan'.*:UserWarning", "ignore:The anyio.abc.BlockingPortal alias.*:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E402"]
